services:
  frontend:
    build:
      context: ./watchmood-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:8000/
    env_file:
      - ./watchmood-frontend/.env

  backend:
    build:
      context: ./watchmood-backend
    ports:
      - "8000:8000"
    volumes:
      - watchmood-data:/app/data
      - chroma_store:/app/chroma_store
    env_file:
      - ./watchmood-backend/.env

volumes:
  watchmood-data:
  chroma_store:
